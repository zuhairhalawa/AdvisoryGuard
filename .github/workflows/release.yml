name: Release

# A version tag runs the checks and uploads the package to npm's stage queue. Nothing becomes public until a
# maintainer approves it with 2FA on npmjs.com. See docs/RELEASING.md.
#
# Pull requests that change this file and manual runs do everything except the upload, as a dry run.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    name: check and stage on npm
    runs-on: ubuntu-latest
    # Trusted publishing can be tied to this environment, which only a version tag uses.
    environment: ${{ github.event_name == 'push' && 'npm-release' || '' }}
    permissions:
      contents: read
      # Lets npm trusted publishing identify this workflow, so no npm token is stored anywhere.
      id-token: write
    steps:
      # Actions are pinned to commits because this workflow can upload a release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Read the version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) DIST_TAG=next ;;
            *) DIST_TAG=latest ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"
          echo "TARBALL=advisoryguard-$VERSION.tgz" >> "$GITHUB_ENV"
          echo "Version $VERSION, dist-tag $DIST_TAG"

      - name: Check the tag
        if: github.event_name == 'push'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG is not on main."
            exit 1
          fi
          if npm view "advisoryguard@$VERSION" version 2>/dev/null | grep -q .; then
            echo "::error::advisoryguard@$VERSION is already on npm. A version cannot be published twice."
            exit 1
          fi

      - run: npm ci
      - run: npm run check
      - run: npm run verify:schema
      - run: npm audit --audit-level=moderate

      - name: Pack and test the tarball
        shell: bash
        run: |
          npm pack --silent
          test -f "$TARBALL"
          node scripts/verify-pack.mjs --tarball "$TARBALL"
          SHA1=$(sha1sum "$TARBALL" | cut -d' ' -f1)
          INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | base64 -w0)"
          {
            echo "### advisoryguard@$VERSION"
            echo ""
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Dist-tag: \`$DIST_TAG\`"
            echo "- sha1: \`$SHA1\`"
            echo "- integrity: \`$INTEGRITY\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tarball
          path: ${{ env.TARBALL }}
          if-no-files-found: error

      # npm stage needs a newer npm than Node 24 ships with. The version is pinned on purpose.
      - name: Install the npm version that can stage
        run: npm install --global npm@11.21.2

      - name: Dry run of the upload
        if: github.event_name != 'push'
        shell: bash
        # npm refuses even a dry run for a version it already has, and main is on one between releases.
        # So this uses a version that can never exist. The change stays on this runner.
        run: |
          DRY_VERSION="$VERSION-dryrun.$GITHUB_RUN_ID"
          npm version "$DRY_VERSION" --no-git-tag-version --ignore-scripts
          npm pack --silent --ignore-scripts
          npm stage publish "./advisoryguard-$DRY_VERSION.tgz" --access public --tag next --dry-run
          echo "Dry run only, as $DRY_VERSION. Nothing was uploaded." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to the npm stage queue
        if: github.event_name == 'push'
        shell: bash
        run: |
          npm stage publish "./$TARBALL" --access public --tag "$DIST_TAG" --provenance
          {
            echo ""
            echo "Staged, not public. Compare the sha1 above, then approve at"
            echo "https://www.npmjs.com/settings/zuhairhalawa/staged-packages"
          } >> "$GITHUB_STEP_SUMMARY"
